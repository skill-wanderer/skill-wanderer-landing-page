{{- if .Values.secret.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels:
    {{- include "skill-wanderer.labels" . | nindent 4 }}
type: Opaque
data: {}
  # Note: Secret data should be created manually or through external secret management
  # This template creates an empty secret that needs to be populated with actual values
  # Use kubectl to create the secret with actual values:
  # kubectl create secret generic skill-wanderer-secrets \
  #   --from-literal=INDEX_NOW_API_KEY="your-indexnow-api-key" \
  #   --from-literal=NUXT_PUBLIC_PATHFINDER_API_URL="https://pathfinder.skill-wanderer.com" \
  #   --from-literal=NUXT_PUBLIC_PATHFINDER_DOMAINS="skill-wanderer.com,wanderings.skill-wanderer.com,dojo.skill-wanderer.com" \
  #   --from-literal=NUXT_PUBLIC_PATHFINDER_SESSION_EXPIRY_MINUTES="30" \
  #   --from-literal=NUXT_PUBLIC_PATHFINDER_SESSION_STORAGE="browser"
{{- end }}
